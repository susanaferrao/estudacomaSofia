<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Estuda Comigo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone app, stacked screens; topic colours match the printed "Missões" sheets. Deliberate single light theme. */
:root{
  --bg:#f3f1fb; --card:#ffffff; --ink:#221d3a; --muted:#6b6585; --line:#e3dff0;
  --accent:#6a3fd1; --accent-soft:#ece6fb;
  --ps:#2563c9; --adv:#1f9452; --pc:#e8730c; --mix:#7b3fb5; --fam:#d6336c; --all:#221d3a;
  --ok:#1f9452; --ok-soft:#e3f5ea; --bad:#d62f2f; --bad-soft:#fde8e8; --gold:#f2b705;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.top{display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:20px;font-weight:800;flex:none}
.chipxp{margin-left:auto;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chipxp b{color:var(--gold)}
.hero{display:flex;align-items:flex-end;gap:14px;background:var(--card);border-radius:24px;padding:18px 18px 0;border:1.5px solid var(--line);overflow:hidden}
.hero img{width:110px;flex:none;align-self:flex-end;border-radius:16px 16px 0 0}
.hero .txt{padding-bottom:18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.level{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 10px;align-self:flex-start}
.xpbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fam))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px}
.subj .ic{font-family:var(--display);font-weight:700;font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.subj.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.subj.off{opacity:.55}
.tag{font-size:12px;font-weight:800;color:var(--muted)}
.testcard{background:var(--accent);color:#fff;border-radius:22px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 #4a2a99}
.testcard .t{font-family:var(--display);font-size:22px;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;border-left:8px solid var(--c)}
.topic .n{font-family:var(--display);font-weight:700;font-size:17px}
.topic .s{font-size:13px;color:var(--muted)}
.topic .best{margin-left:auto;font-weight:800;font-size:13px;color:var(--c);white-space:nowrap;font-variant-numeric:tabular-nums}
.topic>div{min-width:0}
.pill2{display:flex;gap:10px}
.pill2 button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;font-weight:800;text-align:center}
.pill2 button span{display:block;font-size:12px;color:var(--muted);font-weight:700}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.count{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.bubble{display:flex;align-items:flex-end;gap:10px}
.bubble img{width:74px;height:74px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--c);flex:none;background:#fff}
.say{background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700}
.qcard{background:var(--card);border-radius:22px;padding:18px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:14px}
.qchip{align-self:flex-start;font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:3px 10px}
.qtext{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3}
.qimg{display:block;margin:0 auto;width:140px;max-width:100%;border-radius:12px;background:#fff}
.qimg.wide{width:100%;max-width:360px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;font-size:17px;display:flex;gap:12px;align-items:center}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center}
.fb img{width:96px;border-radius:14px;flex:none;align-self:stretch;object-fit:cover;object-position:top}
.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)} .fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.fb h3{font-size:20px}
.fb .tip{margin-top:4px;font-size:15px}
.fb>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.big{width:100%;background:var(--accent);color:#fff;border-radius:18px;padding:16px;font-family:var(--display);font-size:20px;font-weight:700;box-shadow:0 5px 0 #4a2a99}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #4a2a99}
.ghost{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;font-weight:800}
/* result */
.res{background:var(--card);border-radius:24px;padding:20px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.res img{width:170px;border-radius:20px}
.score{font-family:var(--display);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold)} .stars .off{color:var(--line)}
/* progress */
.panel{background:var(--card);border-radius:22px;padding:16px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tbar{grid-column:1/-1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c)}
.trow .nm{font-weight:800;font-size:14px;min-width:0}
.trow .v{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.weak{display:flex;flex-direction:column;gap:8px}
.weak div{background:var(--bad-soft);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--muted);padding:10px}
.sizes{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px}
.seg3{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg3 button{min-width:52px;padding:8px 10px;border-radius:9px;font-weight:800;font-family:var(--display);font-size:17px;color:var(--muted)}
.seg3 button.on{background:var(--accent);color:#fff}
.sync{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
</style>

function stratified(ids,n){ // spread across subtopics
  const g={};shuffle(ids).forEach(i=>{const k=QS[i][1];(g[k]=g[k]||[]).push(i)});
  const keys=shuffle(Object.keys(g)),out=[];let r=0;
  while(out.length<n&&keys.some(k=>g[k].length>r)){keys.forEach(k=>{if(out.length<n&&g[k][r]!==undefined)out.push(g[k][r])});r++}
  return shuffle(out)}
function build(t){
  if(t===T_().err)return shuffle(S.wrong.filter(i=>inCur(i))).slice(0,size());
  if(t===T_().all){const ks=T_().keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(stratified(QS.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0),per))});return shuffle(o)}
  return stratified(QS.map((q,i)=>q[0]===t?i:-1).filter(i=>i>=0),size())}

 const rows=T_().keys.map(k=>{const T=TOPICS[k];let ok=0,n=0;for(const [kk,v] of Object.entries(S.sub))if(kk.startsWith(k+':')){ok+=v[0];n+=v[1]}
   if(!n)return `<div class="trow" style="--c:${T.c}"><span class="nm">${T.n}</span><span class="v">ainda sem respostas</span><div class="tbar"><i style="width:0"></i></div></div>`;
   const p=Math.round(ok/n*100),s=stats(k);const tr=s&&s.prev!==null?(s.last>s.prev?' · a subir ↑':s.last<s.prev?' · a descer ↓':''):'';
   return `<div class="trow" style="--c:${T.c}"><span class="nm">${T.n}</span><span class="v">${p}% certas (${n})${tr}</span><div class="tbar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=Object.entries(S.sub).filter(([k,v])=>v[1]>=3&&SUBN[k]&&T_().keys.includes(k.split(':')[0])).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,4);
 const first5=pcts.slice(0,5),last5=pcts.slice(-5);const evo=pcts.length>=6?Math.round(last5.reduce((a,b)=>a+b,0)/last5.length-first5.reduce((a,b)=>a+b,0)/first5.length):null;
 return `${header('test','A minha evolução')}
 <div class="panel"><div class="kpis"><div class="kpi"><b>${H.length}</b><span>rondas</span></div><div class="kpi"><b>${avg}%</b><span>média</span></div><div class="kpi"><b>${S.xp}</b><span>pontos</span></div></div>
 ${evo!==null?`<p><b>${evo>0?'Estás a evoluir! 🚀':evo<0?'As últimas rondas correram pior. Revê os erros.':'Estás estável.'}</b> <span class="muted">Últimas 5 rondas vs primeiras 5: ${evo>0?'+':''}${evo} pontos percentuais.</span></p>`:'<p class="muted">Faz pelo menos 6 rondas para ver se estás a evoluir.</p>'}</div>
 <div class="panel chart"><h3>Acertos nas últimas ${last.length} rondas</h3>${chart}</div>
 <div class="panel"><h3>Por matéria</h3><p class="muted" style="font-size:13px">Conta todas as respostas, também as da Mistura.</p>${rows}</div>
 <div class="panel"><h3>O que ainda precisa de treino</h3>${weak.length?`<div class="weak">${weak.map(([k,p])=>`<div><span>${SUBN[k]}</span><span>${p}%</span></div>`).join('')}</div>`:'<p class="muted">Nada abaixo de 80% (com pelo menos 3 respostas). Continua assim!</p>'}</div>
 ${syncMsg?`<p class="sync">${syncMsg}</p>`:''}`}

render();
</script>
